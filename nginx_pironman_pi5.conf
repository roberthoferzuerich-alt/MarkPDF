server {
    listen 8048 ssl;
    listen [::]:8048 ssl;
    server_name rhz.internet-box.ch pironman.local;
    root /var/www/pdf_writer;

    # SSL-Zertifikate von Let's Encrypt (bereits vorhanden)
    ssl_certificate /etc/letsencrypt/live/rhz.internet-box.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rhz.internet-box.ch/privkey.pem;

    # Moderne SSL-Sicherheitseinstellungen
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    index index.html;
    charset utf-8;

    # Sicherheits-Header
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Gzip-Komprimierung (inklusive application/wasm für Flutter WebAssembly & CanvasKit!)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/wasm;

    # SPA Routing für Flutter (leitet alle Unterseiten an index.html weiter)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Zugriff auf versteckte Dateien (.git etc.) verweigern
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Flutter-Assets Caching (WASM, CanvasKit, Fonts, Icons, JS, CSS)
    location ~* \.(?:wasm|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML-Dateien & Service-Worker nie cachen (damit Updates sofort aktiv sind!)
    location ~* (?:index\.html|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
