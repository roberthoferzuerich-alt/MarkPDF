# Nginx Server-Block für MarkPDF (pdf_writer) auf dem Raspberry Pi 5 (Pironman)
# Pfad auf dem Pi: /etc/nginx/sites-available/pdf_writer
# Aktivieren mit:
#   sudo ln -s /etc/nginx/sites-available/pdf_writer /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 8048;
    listen [::]:8048;

    # Hostname oder IP-Adresse deines Raspberry Pi 5
    server_name pironman.local pdfwriter.local _;

    # Web-Stammverzeichnis
    root /var/www/pdf_writer;
    index index.html;

    # Gzip-Komprimierung für extreme Performance (besonders für WASM und große JS-Bundles)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript
        application/wasm;

    # SPA Routing: Leitet alle Anfragen an index.html weiter
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caching für statische Web-Assets (CanvasKit, Icons, Fonts, Wasm, JS)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|wasm|otf|ttf|woff|woff2|json)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # CORS Header (falls PDFs oder Ressourcen extern geladen werden)
    add_header Access-Control-Allow-Origin *;
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Embedder-Policy "require-corp";
}
